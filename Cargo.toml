[workspace]
members = ["crates/hearth", "crates/hearth-core"]
exclude = ["experiments"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Frame compression runs every frame, so keep it fast in debug builds too.
[profile.dev.package.miniz_oxide]
opt-level = 3
